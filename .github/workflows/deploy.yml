name: Deploy automático — smoke test do modelo em staging

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Corrigir caminhos absolutos do mlruns
        run: python src/fix_mlruns_paths.py

      - name: Rodar smoke test do modelo em staging
        run: python src/smoke_test.py
